[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stepthree"
version = "0.1.0"
description = "Benchmark: do AI tutors find the FIRST wrong step in a worked solution, and refuse to leak the final answer?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "shreenig99" }]
keywords = ["benchmark", "llm", "tutoring", "sympy", "education", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Education",
]
dependencies = ["sympy>=1.12", "mpmath", "PyYAML>=6", "requests>=2.28", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
stepthree = "stepthree.cli:main"

[project.urls]
Homepage = "https://github.com/shreenig99/stepthree"

[tool.hatch.build.targets.wheel]
packages = ["stepthree"]

[tool.hatch.build.targets.wheel.force-include]
"data/problems" = "stepthree/_data/problems"
"data/items.jsonl" = "stepthree/_data/items.jsonl"

[tool.hatch.build.targets.sdist]
include = ["stepthree", "data/problems", "data/items.jsonl", "tests", "config.yaml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
